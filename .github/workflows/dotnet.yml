name: .NET

on:
  push:
    branches: [ "main" ]
    tags: [ "*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  SONAR_KEY: dysnomia-common-steamwebapi
  SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  CSPROJ: Dysnomia.Common.SteamWebAPI/Dysnomia.Common.SteamWebAPI.csproj
  NUGET_SERVER_ADRESS: https://api.nuget.org/v3/index.json

jobs:
  build:
    permissions:
      id-token: write  # enable GitHub OIDC token issuance for this job

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 11.0.x

    - uses: actions/setup-java@v6
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup sonarscanner
      run: |
        dotnet tool install --global dotnet-sonarscanner

    - name: Start sonarscanner
      run: dotnet sonarscanner begin /k:"${{ env.SONAR_KEY }}" /d:sonar.host.url="${{ env.SONAR_HOST_URL }}" /d:sonar.token="${{ env.SONAR_TOKEN }}" /d:sonar.cs.vscoveragexml.reportsPaths=coverage.xml /d:sonar.coverage.exclusions="**Test*.cs" /d:sonar.branch.name="${{github.ref_name}}"

    - name: Set Version in csproj
      if: startsWith(github.event.ref, 'refs/tags/')
      run: sed -i 's/>1.0.0</>${{github.ref_name}}</g' ${{ env.CSPROJ }}

    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      env:
        PUBLISHER_KEY: ${{ secrets.PUBLISHER_KEY }}
        STEAMID: ${{ secrets.STEAMID }}
        STEAMPROFILE: ${{ secrets.STEAMPROFILE }}
        WEBAPI_KEY: ${{ secrets.WEBAPI_KEY }}
      run: |
        dotnet tool install --global dotnet-coverage
        DOTNET_TEST_RUNNER="Microsoft.Testing.Platform" dotnet-coverage collect 'dotnet test --no-build --verbosity normal' -f xml  -o 'coverage.xml'

    - name: End sonarscanner
      run: dotnet sonarscanner end /d:sonar.token="${{ env.SONAR_TOKEN }}"

    - name: Pack
      run: dotnet pack ${{ env.CSPROJ }} -c Release -o out 

    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@v1
      id: login
      if: startsWith(github.event.ref, 'refs/tags/')
      with:
        user: ${{ secrets.NUGET_USER }}
  
    # Push the package
    - name: NuGet push
      if: startsWith(github.event.ref, 'refs/tags/')
      run: dotnet nuget push --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source ${{ env.NUGET_SERVER_ADRESS }} $(ls out/*.nupkg | head -1)